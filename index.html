<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Glory Shop</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141b2d;
            --accent-color: #00ffcc;
            --text-color: #ffffff;
            --secondary-text: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* Header & Animated Name */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(20, 27, 45, 0.95);
            border-bottom: 1px solid #1f293d;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-area img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            object-fit: cover;
        }

        .shop-name {
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff007f, #00ffcc, #ffff00, #ff007f);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite, floatName 2s ease-in-out infinite alternate;
        }

        @keyframes shine {
            to { background-position: 300% center; }
        }

        @keyframes floatName {
            0% { transform: translateY(0); }
            100% { transform: translateY(-2px); }
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        /* Banner Section */
        .banner-container {
            margin: 12px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1f293d;
            position: relative;
        }

        .banner-container img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .banner-text {
            position: absolute;
            bottom: 8px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            color: var(--accent-color);
        }

        /* Section Title */
        .section-title {
            margin: 15px 12px 10px;
            font-size: 16px;
            color: var(--text-color);
            border-left: 3px solid var(--accent-color);
            padding-left: 6px;
        }

        /* 2-Column Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 12px;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid #1f293d;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            text-align: center;
            padding-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .category-card:hover {
            transform: scale(1.02);
            border-color: var(--accent-color);
        }

        .category-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-bottom: 1px solid #1f293d;
        }

        .category-card h3 {
            font-size: 14px;
            margin: 8px 5px 2px;
            color: var(--text-color);
        }

        /* Modal / Inside Package View */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            width: 92%;
            max-width: 420px;
            border-radius: 12px;
            border: 1px solid var(--accent-color);
            padding: 15px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 20px;
            cursor: pointer;
            color: var(--secondary-text);
        }

        .package-item {
            background: #1c263d;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #28354f;
        }

        .package-item button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        /* Admin Panel Overlay with Left Sidebar */
        #admin-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--card-bg);
            border-bottom: 1px solid #1f293d;
        }

        .admin-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .admin-sidebar {
            width: 140px;
            background: #101624;
            border-right: 1px solid #1f293d;
            padding: 10px 0;
        }

        .sidebar-tab {
            width: 100%;
            padding: 12px 10px;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--secondary-text);
            cursor: pointer;
            font-size: 13px;
            border-left: 3px solid transparent;
        }

        .sidebar-tab.active {
            color: var(--accent-color);
            background: rgba(0, 255, 204, 0.05);
            border-left-color: var(--accent-color);
        }

        .admin-content-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--secondary-text);
            font-size: 13px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 9px;
            background: #1c263d;
            border: 1px solid #28354f;
            color: var(--text-color);
            border-radius: 6px;
            font-size: 13px;
        }

        .save-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        /* Clean Alert */
        .custom-alert {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f883d;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            z-index: 3000;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="customAlert" class="custom-alert">সফলভাবে আপডেট করা হয়েছে!</div>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <img id="mainLogo" src="" alt="Logo">
            <div class="shop-name" id="displayShopName">SF GLORY SHOP</div>
        </div>
        <button class="admin-btn" onclick="toggleAdmin(true)">এডমিন প্যানেল</button>
    </header>

    <!-- Banner -->
    <div class="banner-container">
        <img id="mainBannerImg" src="" alt="Banner">
        <div class="banner-text" id="displayBannerText">🔥 Verified SF Glory Service</div>
    </div>

    <!-- Main Cards Grid (2 Columns) -->
    <div class="section-title">Select Package & Glory Cards</div>
    <div class="cards-grid" id="cardsGridContainer"></div>

    <!-- Package Modal -->
    <div class="modal" id="packageModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modalCardTitle" style="margin-bottom: 12px; color: var(--accent-color);">Card Packages</h3>
            <div id="modalPackagesList"></div>
        </div>
    </div>

    <!-- Admin Panel with Left Sidebar -->
    <div id="admin-panel">
        <div class="admin-header">
            <h3>Admin Control Panel</h3>
            <button class="admin-btn" onclick="toggleAdmin(false)">✕ Close</button>
        </div>
        <div class="admin-body">
            <div class="admin-sidebar">
                <button class="sidebar-tab active" onclick="switchAdminTab(event, 'tabGeneral')">জেনারেল</button>
                <button class="sidebar-tab" onclick="switchAdminTab(event, 'tabCards')">কার্ড ম্যানেজ</button>
                <button class="sidebar-tab" onclick="switchAdminTab(event, 'tabPackages')">প্যাকেজ এডিট</button>
            </div>
            <div class="admin-content-area">
                <!-- Tab 1 -->
                <div id="tabGeneral" class="admin-section active">
                    <div class="form-group">
                        <label>ওয়েবসাইটের নাম</label>
                        <input type="text" id="inputShopName" value="SF GLORY SHOP">
                    </div>
                    <div class="form-group">
                        <label>লোগো ইমেজ লিংক (URL)</label>
                        <input type="text" id="inputLogoUrl">
                    </div>
                    <div class="form-group">
                        <label>ব্যানার ইমেজ লিংক (URL)</label>
                        <input type="text" id="inputBannerUrl">
                    </div>
                    <button class="save-btn" onclick="saveGeneral()">সেভ করুন</button>
                </div>
                <!-- Tab 2 -->
                <div id="tabCards" class="admin-section">
                    <div class="form-group">
                        <label>কার্ডের নাম</label>
                        <input type="text" id="inputCardTitleEdit" value="FF GUILD GLORY">
                    </div>
                    <div class="form-group">
                        <label>কার্ডের ছবি লিংক (URL)</label>
                        <input type="text" id="inputCardImgEdit">
                    </div>
                    <button class="save-btn" onclick="saveCardInfo()">কার্ড আপডেট করুন</button>
                </div>
                <!-- Tab 3 -->
                <div id="tabPackages" class="admin-section">
                    <div class="form-group">
                        <label>প্যাকেজ ও দাম কাস্টমাইজ</label>
                        <input type="text" id="inputPkgEditName" value="1 BASIC (4 BOT) - ৳130">
                    </div>
                    <div class="form-group">
                        <label>স্টক স্ট্যাটাস</label>
                        <select id="inputStock">
                            <option value="In Stock">In Stock</option>
                            <option value="Stock Out">Stock Out</option>
                        </select>
                    </div>
                    <button class="save-btn" onclick="showAlert()">প্যাকেজ সেভ করুন</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let db = {
            shopName: "SF GLORY SHOP",
            logo: "https://via.placeholder.com/40",
            banner: "https://via.placeholder.com/600x160",
            bannerText: "🔥 Verified SF Glory & Bot Service",
            cards: [
                {
                    id: 1,
                    title: "FF GUILD GLORY",
                    image: "https://via.placeholder.com/300x150",
                    packages: [
                        { name: "1 BASIC (4 BOT)", price: "৳130.00", status: "In Stock" },
                        { name: "2 BASIC (8 BOT)", price: "৳250.00", status: "In Stock" }
                    ]
                },
                {
                    id: 2,
                    title: "VIP GLORY CARD",
                    image: "https://via.placeholder.com/300x150",
                    packages: [
                        { name: "5 BASIC (20 BOT)", price: "৳600.00", status: "In Stock" }
                    ]
                }
            ]
        };

        function render() {
            document.getElementById('displayShopName').innerText = db.shopName;
            document.getElementById('mainLogo').src = db.logo;
            document.getElementById('mainBannerImg').src = db.banner;
            document.getElementById('displayBannerText').innerText = db.bannerText;

            let html = '';
            db.cards.forEach(card => {
                html += `
                    <div class="category-card" onclick="openModal(${card.id})">
                        <img src="${card.image}" alt="${card.title}">
                        <h3>${card.title}</h3>
                    </div>
                `;
            });
            document.getElementById('cardsGridContainer').innerHTML = html;
        }

        function openModal(id) {
            let card = db.cards.find(c => c.id === id);
            if(!card) return;
            document.getElementById('modalCardTitle').innerText = card.title;
            let pHtml = '';
            card.packages.forEach(p => {
                pHtml += `
                    <div class="package-item">
                        <div>
                            <strong>${p.name}</strong><br>
                            <span style="color: var(--accent-color);">${p.price}</span> (${p.status})
                        </div>
                        <button onclick="alert('Order placed for ${p.name}')">Buy Now</button>
                    </div>
                `;
            });
            document.getElementById('modalPackagesList').innerHTML = pHtml;
            document.getElementById('packageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('packageModal').style.display = 'none';
        }

        function toggleAdmin(show) {
            document.getElementById('admin-panel').style.display = show ? 'flex' : 'none';
        }

        function switchAdminTab(evt, tabId) {
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function saveGeneral() {
            db.shopName = document.getElementById('inputShopName').value;
            let l = document.getElementById('inputLogoUrl').value;
            let b = document.getElementById('inputBannerUrl').value;
            if(l) db.logo = l;
            if(b) db.banner = b;
            render();
            showAlert();
        }

        function saveCardInfo() {
            showAlert();
        }

        function showAlert() {
            let a = document.getElementById('customAlert');
            a.style.display = 'block';
            setTimeout(() => a.style.display = 'none', 2000);
        }

        render();
    </script>
</body>
</html>
