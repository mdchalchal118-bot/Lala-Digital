<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LALA DIGITAL | Premium Store</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { --neon-green: #00C853; --dark-bg: #0a0a0a; --glass-bg: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Poppins', sans-serif; background-color: var(--dark-bg); color: white; transition: 0.3s; overflow-x: hidden; }
        .light-mode { background-color: #f3f4f6; color: #111; --glass-bg: rgba(0, 0, 0, 0.05); }
        .light-mode .text-white { color: #000 !important; }

        /* Neon Branding */
        .brand-lala { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        .glass { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Fixed Bottom Nav */
        .magic-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; height: 65px; background: #121212; border-radius: 20px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.05); }
        .nav-item { cursor: pointer; color: #555; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; font-size: 22px; }
        .nav-item.active { color: var(--neon-green); transform: translateY(-8px); }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; display: none; overflow-y: auto; padding: 20px; }
        .modal-content { background: #161616; border-radius: 24px; padding: 25px; max-width: 600px; margin: 0 auto; border: 1px solid var(--neon-green); }

        /* Grids */
        .home-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .apk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

        input, textarea, select { background: #222; border: 1px solid #333; color: white; padding: 12px; border-radius: 12px; width: 100%; outline: none; margin-bottom: 10px; }
        input:focus { border-color: var(--neon-green); }
        .btn-neon { background: var(--neon-green); color: black; font-weight: bold; padding: 12px; border-radius: 12px; transition: 0.3s; width: 100%; }
        .btn-neon:hover { box-shadow: 0 0 20px var(--neon-green); transform: scale(1.02); }

        .stock-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .stock-in { background: rgba(0, 200, 83, 0.2); color: #00C853; }
        .stock-out { background: rgba(255, 0, 0, 0.2); color: #ff3d00; }
    </style>
</head>
<body class="pb-24">

    <!-- Header Section -->
    <header class="p-5 flex justify-between items-center sticky top-0 bg-[#0a0a0a]/80 backdrop-blur-md z-50">
        <div id="main-logo" class="text-2xl font-bold tracking-tighter cursor-pointer" onclick="handleLogoClick()">
            <span class="brand-lala">LALA</span> <span class="text-white">DIGITAL</span>
        </div>
        
        <!-- Mandatory Top Bar Icons -->
        <div class="flex gap-2 items-center">
            <button onclick="toggleTheme()" class="w-9 h-9 glass rounded-lg flex items-center justify-center"><i class="fas fa-moon"></i></button>
            <a href="https://tiktok.com/@mr_lala100" target="_blank" class="w-9 h-9 glass rounded-lg flex items-center justify-center text-white hover:text-green-500 transition"><i class="fab fa-tiktok"></i></a>
            <a href="https://youtube.com/@lalagamer100?si=4Xr_a_M3DNGlgiOd" target="_blank" class="w-9 h-9 glass rounded-lg flex items-center justify-center text-red-500 hover:scale-110 transition"><i class="fab fa-youtube"></i></a>
            <a href="https://t.me/toplalabd" target="_blank" class="w-9 h-9 glass rounded-lg flex items-center justify-center text-blue-400 hover:scale-110 transition"><i class="fab fa-telegram"></i></a>
        </div>
    </header>

    <!-- Notice Bar -->
    <div class="bg-green-900/10 py-2 border-y border-white/5 overflow-hidden">
        <marquee id="top-notice" class="text-green-400 text-sm font-medium">Welcome to LALA DIGITAL - Premium Gaming Bot & Topup Service.</marquee>
    </div>

    <!-- Main Content -->
    <main class="p-4">
        <!-- HOME SECTION -->
        <section id="home-sec">
            <div id="banner-box" class="h-44 glass rounded-3xl overflow-hidden mb-6 relative">
                <img id="main-banner" src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800" class="w-full h-full object-cover">
            </div>
            <div class="home-grid" id="home-cards-list"></div>
        </section>

        <!-- APK SECTION -->
        <section id="apk-sec" class="hidden">
            <h2 class="text-center font-bold mb-4 opacity-70">ANDROID APPS STORE</h2>
            <div class="apk-grid" id="apk-cards-list"></div>
        </section>

        <!-- BIO SECTION -->
        <section id="bio-sec" class="hidden text-center py-10">
            <i class="fas fa-file-alt text-4xl text-green-500 mb-3"></i>
            <h2 class="font-bold">Bio & Scripts</h2>
            <p class="text-xs text-gray-500">More data coming soon...</p>
        </section>
    </main>

    <!-- Bottom Magic Navigation -->
    <nav class="magic-nav">
        <div class="nav-item active" onclick="switchTab('home-sec', 0)"><i class="fas fa-home"></i></div>
        <div class="nav-item" onclick="switchTab('apk-sec', 1)"><i class="fab fa-android"></i></div>
        <div class="nav-item" onclick="switchTab('bio-sec', 2)"><i class="fas fa-id-card"></i></div>
        <div class="nav-item" onclick="window.open('https://t.me/toplalabd')"><i class="fas fa-paper-plane"></i></div>
        <div class="nav-item" onclick="triggerAdmin()"><i class="fas fa-shield-halved"></i></div>
    </nav>

    <!-- ================= MODALS ================= -->

    <!-- Home Card Editor Modal -->
    <div id="home-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold brand-lala">Edit Home Card</h2>
                <button onclick="closeModals()" class="text-red-500 text-2xl">&times;</button>
            </div>
            <div class="space-y-3">
                <label class="text-[10px] uppercase text-gray-500">Card Title & Banner</label>
                <input type="text" id="h-title" placeholder="Card Title">
                <input type="text" id="h-banner-url" placeholder="Image URL">
                <div class="flex items-center gap-2">
                    <span class="text-xs">Or Upload:</span>
                    <input type="file" id="h-banner-file" accept="image/*" class="text-xs border-none bg-transparent">
                </div>

                <div class="border-t border-gray-800 pt-3">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-bold">Package List</label>
                        <button onclick="addPackageInput()" class="text-xs bg-green-700 px-2 py-1 rounded">+ Add</button>
                    </div>
                    <div id="pkg-editor-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
                </div>

                <div class="border-t border-gray-800 pt-3">
                    <label class="text-sm font-bold">Rules & Conditions</label>
                    <textarea id="h-rules" rows="3" placeholder="Enter rules (one per line)"></textarea>
                </div>

                <button onclick="saveHomeCardData()" class="btn-neon">SAVE CARD CHANGES</button>
            </div>
        </div>
    </div>

    <!-- APK Editor Modal -->
    <div id="apk-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-blue-500">Edit APK Item</h2>
                <button onclick="closeModals()" class="text-red-500 text-2xl">&times;</button>
            </div>
            <div class="space-y-4">
                <input type="text" id="a-name" placeholder="App Name">
                <input type="text" id="a-bio" placeholder="App Bio/Description">
                <input type="text" id="a-link" placeholder="Direct Download Link">
                <div>
                    <label class="text-xs text-gray-500">Upload Icon:</label>
                    <input type="file" id="a-file" accept="image/*" class="text-xs">
                </div>
                <button onclick="saveAPKData()" class="btn-neon bg-blue-600">UPDATE APP</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel (Selection) -->
    <div id="admin-panel" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold brand-lala">VIP Admin Panel</h2>
                <button onclick="closeModals()" class="bg-red-600 px-3 py-1 rounded text-xs">Exit</button>
            </div>
            <div id="admin-list-content"></div>
        </div>
    </div>

    <!-- Product Detail Overlay -->
    <div id="detail-view" class="modal-overlay" style="background: var(--dark-bg);">
        <button onclick="closeModals()" class="mb-5 text-green-500 font-bold"><i class="fas fa-chevron-left"></i> BACK</button>
        <div id="detail-content"></div>
    </div>

    <script>
        // --- ISOLATED DATA STORAGE ---
        const storageKeys = { home: 'LALA_HOME_DATA', apk: 'LALA_APK_DATA', config: 'LALA_CONFIG' };

        let homeData = JSON.parse(localStorage.getItem(storageKeys.home)) || [
            { id: 101, title: "FF Guild Glory Bot", banner: "https://via.placeholder.com/400", rules: ["Rule 1", "Rule 2"], packages: [{name: "4 BOT BASIC", price: "130", stock: true}] }
        ];

        let apkData = JSON.parse(localStorage.getItem(storageKeys.apk)) || [
            { id: 201, name: "LALA Tool", bio: "Gaming Script", link: "#", icon: "https://via.placeholder.com/100" }
        ];

        let config = JSON.parse(localStorage.getItem(storageKeys.config)) || { whatsapp: "01903982821", banner: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800", notice: "Welcome to LALA DIGITAL!" };

        // --- CORE FUNCTIONS ---
        function saveAll() {
            localStorage.setItem(storageKeys.home, JSON.stringify(homeData));
            localStorage.setItem(storageKeys.apk, JSON.stringify(apkData));
            localStorage.setItem(storageKeys.config, JSON.stringify(config));
            renderUI();
        }

        function switchTab(id, idx) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach((n, i) => {
                n.classList.toggle('active', i === idx);
            });
        }

        function renderUI() {
            document.getElementById('top-notice').innerText = config.notice;
            document.getElementById('main-banner').src = config.banner;

            // Render Home Cards (2 Columns)
            const homeList = document.getElementById('home-cards-list');
            homeList.innerHTML = homeData.map(c => `
                <div class="glass rounded-2xl overflow-hidden" onclick="viewProduct(${c.id})">
                    <img src="${c.banner}" class="w-full h-32 object-cover">
                    <div class="p-3">
                        <h3 class="text-xs font-bold truncate">${c.title}</h3>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-[9px] text-green-500">Available ✅</span>
                            <span class="text-[9px] bg-white/10 px-1 rounded">${c.packages.length} Pkgs</span>
                        </div>
                    </div>
                </div>
            `).join('');

            // Render APK Cards (4 Columns)
            const apkList = document.getElementById('apk-cards-list');
            apkList.innerHTML = apkData.map(a => `
                <div class="flex flex-col items-center">
                    <div class="w-16 h-16 glass rounded-2xl p-1 mb-1 overflow-hidden">
                        <img src="${a.icon}" class="w-full h-full object-cover rounded-xl">
                    </div>
                    <span class="text-[10px] font-bold truncate w-full text-center">${a.name}</span>
                    <button onclick="window.open('${a.link}')" class="text-[8px] bg-green-600 text-black font-bold px-2 py-1 rounded-full mt-1">DOWNLOAD</button>
                </div>
            `).join('');
        }

        // --- PRODUCT VIEW ---
        function viewProduct(id) {
            const card = homeData.find(c => c.id === id);
            const view = document.getElementById('detail-content');
            view.innerHTML = `
                <img src="${card.banner}" class="w-full h-48 object-cover rounded-3xl mb-5 shadow-lg">
                <h2 class="text-2xl font-bold brand-lala mb-1">${card.title}</h2>
                <p class="text-xs text-gray-500 mb-5">Premium Service by LALA DIGITAL</p>
                
                <div class="glass p-4 rounded-2xl mb-6">
                    <h4 class="text-sm font-bold text-yellow-500 mb-2">Rules & Conditions:</h4>
                    <ul class="text-[11px] space-y-2 opacity-80">
                        ${card.rules.map(r => `<li>• ${r}</li>`).join('')}
                    </ul>
                </div>

                <div class="space-y-3">
                    ${card.packages.map(p => `
                        <div class="flex justify-between items-center glass p-4 rounded-2xl ${!p.stock ? 'opacity-40' : ''}">
                            <div>
                                <h4 class="font-bold text-sm">${p.name}</h4>
                                <span class="text-green-500 font-bold">৳ ${p.price}</span>
                            </div>
                            <button ${!p.stock ? 'disabled' : ''} onclick="orderNow('${card.title}', '${p.name}', '${p.price}')" class="bg-green-600 text-black px-5 py-2 rounded-xl font-bold text-sm">
                                ${p.stock ? 'BUY NOW' : 'STOCK OUT'}
                            </button>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('detail-view').style.display = 'block';
        }

        function orderNow(title, pkg, price) {
            const msg = `Hello Admin, I want to order:\n- Product: ${title}\n- Package: ${pkg}\n- Price: ${price} BDT\nFrom LALA DIGITAL Website.`;
            window.open(`https://wa.me/${config.whatsapp}?text=${encodeURIComponent(msg)}`);
        }

        // --- ADMIN LOGIC ---
        let targetIndex = null;
        let clickTime = 0;

        function handleLogoClick() {
            clickTime++;
            if(clickTime >= 4) {
                clickTime = 0;
                triggerAdmin();
            }
            setTimeout(() => clickTime = 0, 2000);
        }

        async function triggerAdmin() {
            const { value: pass } = await Swal.fire({
                title: 'VIP Access', input: 'password', inputPlaceholder: 'Enter PIN',
                background: '#111', color: '#fff', confirmButtonColor: '#00C853'
            });
            if(pass === 'lala999') openAdminPanel();
        }

        function openAdminPanel() {
            const currentTab = document.querySelector('section:not(.hidden)').id;
            const content = document.getElementById('admin-list-content');
            
            if(currentTab === 'home-sec') {
                content.innerHTML = `
                    <button onclick="editGlobal()" class="w-full bg-blue-600 p-3 rounded-xl mb-4 font-bold">Global Settings (Notice/Banner)</button>
                    <div class="space-y-2">
                        <p class="text-xs text-gray-500 font-bold uppercase">Manage Home Cards</p>
                        ${homeData.map((c, i) => `
                            <div class="flex justify-between items-center glass p-3 rounded-xl">
                                <span class="text-sm truncate w-1/2">${c.title}</span>
                                <div class="flex gap-2">
                                    <button onclick="openHomeEditor(${i})" class="text-blue-500 text-xs font-bold">✏️ Edit</button>
                                    <button onclick="deleteHome(${i})" class="text-red-500 text-xs font-bold">🗑️ Del</button>
                                </div>
                            </div>
                        `).join('')}
                        <button onclick="addHomeCard()" class="w-full btn-neon mt-4">+ Create New Card</button>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="space-y-2">
                        <p class="text-xs text-gray-500 font-bold uppercase">Manage APK Items</p>
                        ${apkData.map((a, i) => `
                            <div class="flex justify-between items-center glass p-3 rounded-xl">
                                <span class="text-sm truncate w-1/2">${a.name}</span>
                                <div class="flex gap-2">
                                    <button onclick="openAPKEditor(${i})" class="text-blue-500 text-xs font-bold">✏️ Edit</button>
                                    <button onclick="deleteAPK(${i})" class="text-red-500 text-xs font-bold">🗑️ Del</button>
                                </div>
                            </div>
                        `).join('')}
                        <button onclick="addAPKCard()" class="w-full btn-neon bg-blue-600 mt-4">+ Create New APK</button>
                    </div>
                `;
            }
            document.getElementById('admin-panel').style.display = 'block';
        }

        // --- EDITING LOGIC ---
        function openHomeEditor(idx) {
            targetIndex = idx;
            const card = homeData[idx];
            document.getElementById('h-title').value = card.title;
            document.getElementById('h-banner-url').value = card.banner;
            document.getElementById('h-rules').value = card.rules.join('\n');
            
            const pkgList = document.getElementById('pkg-editor-list');
            pkgList.innerHTML = '';
            card.packages.forEach(p => addPackageInput(p.name, p.price, p.stock));
            
            document.getElementById('home-modal').style.display = 'block';
        }

        function addPackageInput(name='', price='', stock=true) {
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center glass p-2 rounded-lg";
            div.innerHTML = `
                <input type="text" placeholder="Name" value="${name}" class="m-0 text-xs flex-1 pkg-n">
                <input type="number" placeholder="Price" value="${price}" class="m-0 text-xs w-16 pkg-p">
                <select class="m-0 text-[10px] w-14 pkg-s">
                    <option value="true" ${stock ? 'selected' : ''}>IN</option>
                    <option value="false" ${!stock ? 'selected' : ''}>OUT</option>
                </select>
                <button onclick="this.parentElement.remove()" class="text-red-500">×</button>
            `;
            document.getElementById('pkg-editor-list').appendChild(div);
        }

        async function saveHomeCardData() {
            const card = homeData[targetIndex];
            const bannerFile = document.getElementById('h-banner-file').files[0];
            let bannerFinal = document.getElementById('h-banner-url').value;

            if(bannerFile) bannerFinal = await toBase64(bannerFile);

            const pkgs = [];
            document.querySelectorAll('#pkg-editor-list > div').forEach(row => {
                pkgs.push({
                    name: row.querySelector('.pkg-n').value,
                    price: row.querySelector('.pkg-p').value,
                    stock: row.querySelector('.pkg-s').value === 'true'
                });
            });

            homeData[targetIndex] = {
                ...card,
                title: document.getElementById('h-title').value,
                banner: bannerFinal,
                rules: document.getElementById('h-rules').value.split('\n').filter(r => r.trim() !== ''),
                packages: pkgs
            };
            saveAll();
            closeModals();
            Swal.fire('Success', 'Card Updated!', 'success');
        }

        // --- APK LOGIC ---
        function openAPKEditor(idx) {
            targetIndex = idx;
            const app = apkData[idx];
            document.getElementById('a-name').value = app.name;
            document.getElementById('a-bio').value = app.bio;
            document.getElementById('a-link').value = app.link;
            document.getElementById('apk-modal').style.display = 'block';
        }

        async function saveAPKData() {
            const iconFile = document.getElementById('a-file').files[0];
            let iconFinal = apkData[targetIndex].icon;

            if(iconFile) iconFinal = await toBase64(iconFile);

            apkData[targetIndex] = {
                ...apkData[targetIndex],
                name: document.getElementById('a-name').value,
                bio: document.getElementById('a-bio').value,
                link: document.getElementById('a-link').value,
                icon: iconFinal
            };
            saveAll();
            closeModals();
            Swal.fire('Success', 'APK Info Updated!', 'success');
        }

        // --- UTILS ---
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = e => reject(e);
            });
        }

        async function editGlobal() {
            const { value: formValues } = await Swal.fire({
                title: 'Global Settings',
                html: `
                    <input id="g-wa" class="swal2-input" placeholder="WhatsApp Number" value="${config.whatsapp}">
                    <input id="g-nt" class="swal2-input" placeholder="Notice Text" value="${config.notice}">
                    <input id="g-bn" class="swal2-input" placeholder="Main Banner URL" value="${config.banner}">
                `,
                preConfirm: () => [ document.getElementById('g-wa').value, document.getElementById('g-nt').value, document.getElementById('g-bn').value ]
            });
            if(formValues) {
                [config.whatsapp, config.notice, config.banner] = formValues;
                saveAll();
            }
        }

        function addHomeCard() { homeData.push({ id: Date.now(), title: "New Product", banner: "https://via.placeholder.com/400", rules: [], packages: [] }); saveAll(); openAdminPanel(); }
        function addAPKCard() { apkData.push({ id: Date.now(), name: "New App", bio: "Short bio", link: "#", icon: "https://via.placeholder.com/100" }); saveAll(); openAdminPanel(); }
        function deleteHome(i) { homeData.splice(i, 1); saveAll(); openAdminPanel(); }
        function deleteAPK(i) { apkData.splice(i, 1); saveAll(); openAdminPanel(); }
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        renderUI();
    </script>
</body>
</html>
