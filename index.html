<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF GLORY SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-select { user-select: none; pointer-events: none; }
        .gradient-text { background: linear-gradient(90deg, #ff00cc, #33ccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .neon-glow { box-shadow: 0 0 15px rgba(51, 204, 255, 0.5); }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans selection:bg-pink-500">

    <!-- HEADER -->
    <header class="p-6 flex justify-between items-center bg-gray-900/80 backdrop-blur-md border-b border-gray-800">
        <div id="brand-container" class="cursor-pointer" onclick="handleLogoClick()">
            <h1 id="brand-name" class="text-3xl font-black italic tracking-tighter gradient-text no-select uppercase">
                FF GLORY SHOP
            </h1>
        </div>
        <img id="logo-img" src="https://via.placeholder.com/50" class="w-12 h-12 rounded-full border-2 border-pink-500" alt="Logo">
    </header>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-xl border border-pink-500 w-96">
            <h2 class="text-xl font-bold mb-4">Admin Panel</h2>
            <input type="password" id="admin-pass" placeholder="Enter Password" class="w-full p-2 mb-4 bg-gray-700 rounded text-white">
            <button onclick="checkAdmin()" class="w-full bg-pink-600 p-2 rounded font-bold">Login</button>
            <div id="admin-controls" class="hidden mt-4 space-y-2">
                <input type="text" id="new-name" placeholder="Change Website Name" class="w-full p-2 bg-gray-700 rounded">
                <button onclick="updateSettings()" class="w-full bg-blue-600 p-2 rounded">Update Changes</button>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="container mx-auto p-4">
        <!-- Banner -->
        <section id="banner" class="w-full h-64 bg-gray-800 rounded-2xl flex items-center justify-center neon-glow">
            <h2 class="text-4xl font-bold">Banner Section</h2>
        </section>

        <!-- Services -->
        <section class="mt-10 grid grid-cols-2 gap-4">
            <div class="bg-gray-900 p-6 rounded-lg border border-gray-700 hover:border-pink-500 transition-all cursor-pointer">
                <h3 class="text-xl font-bold">FF GUILD GLORY</h3>
            </div>
        </section>
    </main>

    <script>
        // State Management
        let clickCount = 0;
        
        function handleLogoClick() {
            clickCount++;
            if (clickCount === 4) {
                document.getElementById('admin-modal').classList.remove('hidden');
                clickCount = 0;
            }
            setTimeout(() => clickCount = 0, 2000);
        }

        function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'mrlala') {
                document.getElementById('admin-controls').classList.remove('hidden');
                alert("Authenticated!");
            }
        }

        function updateSettings() {
            const newName = document.getElementById('new-name').value;
            if (newName) {
                document.getElementById('brand-name').innerText = newName;
                localStorage.setItem('siteName', newName);
            }
        }

        // Persistence Load
        window.onload = () => {
            const savedName = localStorage.getItem('siteName');
            if (savedName) document.getElementById('brand-name').innerText = savedName;
        };
    </script>
</body>
</html>
